spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clientdesk}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:clientdesk}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:clientdesk}

server.servlet.session.cookie.secure=false

clientdesk.frontend.origin=http://localhost:4200
clientdesk.ai.enabled=false
clientdesk.api.rate-limit.enabled=false
clientdesk.auth.rate-limit.enabled=false
