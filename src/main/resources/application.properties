spring.application.name=clientdesk-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/clientdesk
spring.datasource.username=clientdesk
spring.datasource.password=clientdesk

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

clientdesk.frontend.origin=${FRONTEND_ORIGIN:http://localhost:4200}

clientdesk.ai.enabled=${AI_ENABLED:false}
clientdesk.ai.openai.api-key=${OPENAI_API_KEY:}
clientdesk.ai.openai.base-url=https://api.openai.com/v1
clientdesk.ai.openai.model=gpt-5-nano
clientdesk.ai.rate-limit.enabled=${AI_RATE_LIMIT_ENABLED:true}
clientdesk.ai.rate-limit.max-requests=${AI_RATE_LIMIT_MAX_REQUESTS:20}
clientdesk.ai.rate-limit.window-seconds=${AI_RATE_LIMIT_WINDOW_SECONDS:60}

management.endpoints.web.exposure.include=health,info
