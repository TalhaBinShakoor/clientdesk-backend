spring.application.name=clientdesk-backend
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.forward-headers-strategy=none
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:6MB}

clientdesk.api.max-json-request-bytes=${MAX_JSON_REQUEST_BYTES:262144}

clientdesk.attachments.storage-root=${ATTACHMENT_STORAGE_ROOT:uploads/request-attachments}
clientdesk.attachments.max-file-bytes=${ATTACHMENT_MAX_FILE_BYTES:5242880}
clientdesk.attachments.max-files-per-work-request=${ATTACHMENT_MAX_FILES_PER_WORK_REQUEST:20}
clientdesk.attachments.max-bytes-per-organization=${ATTACHMENT_MAX_BYTES_PER_ORGANIZATION:52428800}
clientdesk.attachments.allowed-content-types=application/pdf,image/png,image/jpeg,text/plain,text/csv

clientdesk.ai.enabled=${AI_ENABLED:false}
clientdesk.ai.openai.api-key=${OPENAI_API_KEY:}
clientdesk.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
clientdesk.ai.openai.model=${OPENAI_MODEL:gpt-5-nano}
clientdesk.ai.openai.connect-timeout=${OPENAI_CONNECT_TIMEOUT:3s}
clientdesk.ai.openai.read-timeout=${OPENAI_READ_TIMEOUT:15s}
clientdesk.ai.openai.max-response-bytes=${OPENAI_MAX_RESPONSE_BYTES:131072}
clientdesk.ai.max-context-comments=${AI_MAX_CONTEXT_COMMENTS:50}
clientdesk.ai.max-context-characters=${AI_MAX_CONTEXT_CHARACTERS:20000}
clientdesk.ai.max-output-characters=${AI_MAX_OUTPUT_CHARACTERS:6000}
clientdesk.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:800}
clientdesk.api.rate-limit.enabled=${API_RATE_LIMIT_ENABLED:true}
clientdesk.api.rate-limit.window-seconds=${API_RATE_LIMIT_WINDOW_SECONDS:60}
clientdesk.api.rate-limit.max-tracked-keys=${API_RATE_LIMIT_MAX_TRACKED_KEYS:20000}
clientdesk.api.rate-limit.write.max-per-user=${WRITE_RATE_LIMIT_PER_USER:60}
clientdesk.api.rate-limit.write.max-per-organization=${WRITE_RATE_LIMIT_PER_ORGANIZATION:300}
clientdesk.api.rate-limit.upload.max-per-user=${UPLOAD_RATE_LIMIT_PER_USER:10}
clientdesk.api.rate-limit.upload.max-per-organization=${UPLOAD_RATE_LIMIT_PER_ORGANIZATION:50}
clientdesk.api.rate-limit.download.max-per-user=${DOWNLOAD_RATE_LIMIT_PER_USER:60}
clientdesk.api.rate-limit.download.max-per-organization=${DOWNLOAD_RATE_LIMIT_PER_ORGANIZATION:300}
clientdesk.api.rate-limit.ai.max-per-user=${AI_RATE_LIMIT_PER_USER:20}
clientdesk.api.rate-limit.ai.max-per-organization=${AI_RATE_LIMIT_PER_ORGANIZATION:100}

clientdesk.auth.rate-limit.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
clientdesk.auth.rate-limit.max-failures-per-account-ip=${AUTH_RATE_LIMIT_MAX_FAILURES_PER_ACCOUNT_IP:5}
clientdesk.auth.rate-limit.max-failures-per-ip=${AUTH_RATE_LIMIT_MAX_FAILURES_PER_IP:20}
clientdesk.auth.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:900}
clientdesk.auth.rate-limit.max-tracked-keys=${AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:10000}

management.endpoints.web.exposure.include=health,info
