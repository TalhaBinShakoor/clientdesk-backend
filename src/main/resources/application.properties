spring.application.name=clientdesk-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/clientdesk
spring.datasource.username=clientdesk
spring.datasource.password=clientdesk

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

clientdesk.ai.openai.api-key=${OPENAI_API_KEY:}
clientdesk.ai.openai.base-url=https://api.openai.com/v1
clientdesk.ai.openai.model=gpt-5-nano

management.endpoints.web.exposure.include=health,info
